name: Build and publish Atlas Fit APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-fit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK and identify version
        id: package
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          cp app/build/outputs/apk/debug/app-debug.apk atlas-fit.apk
          "$tools/apksigner" verify --verbose atlas-fit.apk
          version=$("$tools/aapt" dump badging atlas-fit.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-fit-apk
          path: atlas-fit.apk
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atlas-fit-apk
      - name: Publish versioned APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release $tag já existe."
            exit 0
          fi
          gh release create "$tag" atlas-fit.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Atlas Fit $VERSION para Android" \
            --notes "APK de teste para instalação inicial no Android. Atualizações sobre uma instalação anterior exigem a mesma chave de assinatura." --latest
