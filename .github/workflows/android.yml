name: Build and publish Atlas Fit APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk atlas-fit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-fit-debug-apk
          path: atlas-fit.apk
      - name: Publish APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest atlas-fit.apk --clobber
          else
            gh release create latest atlas-fit.apk --target "${GITHUB_SHA}" --title "Atlas Fit — APK Android" --notes "Versão de testes do Atlas Fit. Instale por sua conta e risco; não distribuída pela Play Store." --latest
          fi
